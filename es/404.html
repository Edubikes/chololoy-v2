<!DOCTYPE html>
<html lang="es-MX">
<meta charset="utf-8"/>
<title>Página no encontrada – Chololoy®</title>
<meta content="noindex" name="robots"/>
<a id="home" href="/es/">Ir al inicio de Chololoy®</a>
<script>
(function(){
  var path=location.pathname;
  var base=(path==="/chololoy-v2"||path.indexOf("/chololoy-v2/")===0)?"/chololoy-v2":"";
  var dest=base+"/es/";
  var a=document.getElementById("home");
  if(a)a.setAttribute("href",dest);
  location.replace(dest);
})();
</script>
</html>
